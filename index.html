<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Tester</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="type-tester-box">
  
    <!-- 1. Realtime Text Workspace -->
    <div class="tester-wrapper">
      <div 
        id="liveOutput" 
        class="tester-textarea" 
        style="--size: 13;" 
        contenteditable="true" 
        spellcheck="false"
      >Type...</div>
    </div>
  
    <!-- 2. The Floating Dashboard -->
    <div class="tester-dashboard">

      <!-- Font Weight Selector -->
      <div class="ctrl-grp">
        <label class="tester-label">Style</label>
        <div class="select-wrap">
          <select 
            class="tester-select" 
            onchange="document.getElementById('liveOutput').style.fontWeight = this.value;"
          >
            <option value="400">Regular</option>
            <option value="700">Bold</option>
          </select>
        </div>
      </div>
  
      <!-- Text Size Slider -->
      <div class="ctrl-grp">
        <label class="tester-label">Size</label>
        <input 
          type="range" 
          class="tester-slider" 
          min="2" 
          max="24"
          step="0.5" 
          value="13" 
          oninput="document.getElementById('liveOutput').style.setProperty('--size', this.value);"
        >
      </div>
  
      <!-- Paragraph Alignment Group -->
      <div class="ctrl-grp">
        <label class="tester-label">Alignment</label>
        <div class="btn-grp">
          <button 
            type="button" 
            class="toggle-btn" 
            onclick="document.getElementById('liveOutput').style.textAlign = 'left';"
          >L</button>
          <button 
            type="button" 
            class="toggle-btn" 
            onclick="document.getElementById('liveOutput').style.textAlign = 'center';"
          >C</button>
          <button 
            type="button" 
            class="toggle-btn" 
            onclick="document.getElementById('liveOutput').style.textAlign = 'right';"
          >R</button>
        </div>
      </div>
  
      <!-- Text Case Transformation Group -->
      <div class="ctrl-grp">
        <label class="tester-label">Case</label>
        <div class="btn-grp">
          <button 
            type="button" 
            class="toggle-btn" 
            onclick="document.getElementById('liveOutput').style.textTransform = 'lowercase';"
          >aa</button>
          <button 
            type="button" 
            class="toggle-btn" 
            onclick="document.getElementById('liveOutput').style.textTransform = 'capitalize';"
          >Aa</button>
          <button 
            type="button" 
            class="toggle-btn" 
            onclick="document.getElementById('liveOutput').style.textTransform = 'uppercase';"
          >AA</button>
        </div>
      </div>
  
    </div>
  
  </div>
  <div class="whitespace"></div>
</body>

</html>
